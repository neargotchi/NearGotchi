<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anchor Tuner</title>
<!--
  Drop-1 anchor tuner (docs/PLAN-COLLECTION.md §2). Local tool, not part of the site.
  Run from the repo root:  python3 -m http.server 8000   →   http://localhost:8000/scripts/anchor-tuner.html
  Mirrors scripts/drop1_lib.py placement()/compose(): pet 1× at (211, 214), items NEAREST, z back<pet<body<neck<eyes<head.
  Keys: arrows = 1 px, shift+arrows = 10 px, [ / ] = scale ∓0.01 (shift ∓0.05), 0 = reset target. Drag on the canvas to move.
  "Copy JSON" → paste over data/anchors.json, then: python3 scripts/check_anchors.py
-->
<style>
  :root { --bg: #f4f2ec; --panel: #fff; --ink: #1b1d22; --muted: #6b6f78; --line: #d8d5cc; --accent: #16a37a; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #16181d; --panel: #1f2229; --ink: #ecebe6; --muted: #9a9ea8; --line: #343842; --accent: #2fd3a0; } }
  :root[data-theme="dark"] { --bg: #16181d; --panel: #1f2229; --ink: #ecebe6; --muted: #9a9ea8; --line: #343842; --accent: #2fd3a0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  main { display: flex; gap: 16px; padding: 16px; flex-wrap: wrap; }
  canvas { width: min(100%, 768px); aspect-ratio: 1; image-rendering: pixelated; border: 1px solid var(--line); cursor: move; touch-action: none; }
  aside { flex: 1 1 300px; max-width: 460px; background: var(--panel); border: 1px solid var(--line); padding: 12px; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  label { display: flex; justify-content: space-between; gap: 8px; margin: 4px 0; align-items: center; }
  select, button { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); padding: 3px 6px; }
  button { cursor: pointer; } button.primary { background: var(--accent); color: #0b1a14; border-color: transparent; }
  fieldset { border: 1px solid var(--line); margin: 10px 0; padding: 6px 10px; }
  .readout { white-space: pre; color: var(--muted); margin: 8px 0; }
  textarea { width: 100%; height: 160px; font: 12px ui-monospace, monospace; background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
  .err { color: #d0473c; }
</style>
</head>
<body>
<main>
  <canvas id="cv" width="1024" height="1024" tabindex="0" aria-label="composition preview"></canvas>
  <aside>
    <h1>drop 1 · anchor tuner</h1>
    <label>pet <select id="pet"></select></label>
    <label>background <select id="bg"></select></label>
    <fieldset><legend>items (one per slot)</legend><div id="slots"></div></fieldset>
    <label>edit slot <select id="slot"></select></label>
    <label>edit target
      <select id="mode">
        <option value="slot">slot anchor (pet × slot, all items)</option>
        <option value="petItem">override: this pet × item</option>
        <option value="item">override: item, all pets</option>
      </select></label>
    <div class="readout" id="readout"></div>
    <button class="primary" id="copy">Copy JSON</button>
    <button id="download">Download</button>
    <button id="reload">Reload file</button>
    <span id="status"></span>
    <p style="color:var(--muted)">arrows 1px · shift 10px · [ ] scale · 0 reset · drag to move</p>
    <textarea id="out" readonly aria-label="anchors.json"></textarea>
  </aside>
</main>
<script>
const SLOTS = ["head", "eyes", "neck", "body", "back"];
const Z = ["back", "pet", "body", "neck", "eyes", "head"];
const ITEMS = { head: ["beanie", "cap", "crown", "halo", "headphones", "keffiyeh", "tophat"],
  eyes: ["mask", "nerd", "pixel", "sunglasses"], neck: ["chain"], body: ["tshirt"], back: ["cape"] };
// measured art-pixel size (px per art pixel) of the source PNGs; pets ≈ 11.5
const ART = { cape: 9, tshirt: 9, mask: 9, nerd: 8, pixel: 12, sunglasses: 8, beanie: 11, cap: 10, crown: 11,
  halo: 11, headphones: 10, keffiyeh: 11, tophat: 10, chain: 9 };
const BGS = ["c01-lcd-dots", "c02-desert", "c03-cozy-room", "c04-pixel-grass", "c05-soft-sky", "c06-cream-grid",
  "r07-night-pixel", "r08-sunset", "r09-near-green", "e10-golden-hour", "e11-cosmic", "l12-legendary-glow"];
const ALIGN = { top: [0.5, 0], center: [0.5, 0.5], bottom: [0.5, 1] };
const OFF = [211, 214];
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const imgs = {};
let A = null, original = null;

function load(src) {
  if (!imgs[src]) imgs[src] = new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(src); i.src = src; });
  return imgs[src];
}
const petSrc = p => `../public/pets/${p}/nft.png`;
const itemSrc = it => `../public/items/${Object.keys(ITEMS).find(s => ITEMS[s].includes(it))}/${it}.png`;
const slotOf = it => SLOTS.find(s => ITEMS[s].includes(it));

async function loadFile() {
  const r = await fetch("../data/anchors.json", { cache: "no-store" });
  A = await r.json(); A.overrides = A.overrides || {}; original = JSON.parse(JSON.stringify(A));
}

// mirrors drop1_lib.placement()
function placement(pet, it, img) {
  const base = A[pet][slotOf(it)];
  let x = base.x, y = base.y, s = base.scale, [ax, ay] = ALIGN[base.align || "center"];
  for (const key of [it, `${pet}:${it}`]) {
    const o = A.overrides[key];
    if (o) { x += o.dx || 0; y += o.dy || 0; s *= o.scale || 1; if (o.align) [ax, ay] = ALIGN[o.align]; }
  }
  const w = Math.max(1, Math.round(img.width * s)), h = Math.max(1, Math.round(img.height * s));
  return { x: Math.round(x - ax * w), y: Math.round(y - ay * h), w, h, s };
}

function chosen() {
  const out = {};
  for (const s of SLOTS) { const v = $("sel-" + s).value; if (v) out[s] = v; }
  return out;
}

async function draw() {
  const pet = $("pet").value, acc = chosen();
  ctx.imageSmoothingEnabled = false;
  const bg = $("bg").value;
  if (bg.startsWith("#")) { ctx.fillStyle = bg; ctx.fillRect(0, 0, 1024, 1024); }
  else ctx.drawImage(await load(`../assets-raw/backgrounds/${bg}.png`), 0, 0);
  for (const layer of Z) {
    if (layer === "pet") { ctx.drawImage(await load(petSrc(pet)), OFF[0], OFF[1]); continue; }
    const it = acc[layer]; if (!it) continue;
    const img = await load(itemSrc(it)), p = placement(pet, it, img);
    ctx.drawImage(img, OFF[0] + p.x, OFF[1] + p.y, p.w, p.h);
  }
  // baseline + anchor marker
  ctx.fillStyle = "rgba(255,0,80,.5)"; ctx.fillRect(0, 960, 1024, 1);
  const slot = $("slot").value, b = A[pet][slot];
  ctx.strokeStyle = "#ff2e6e"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(OFF[0] + b.x, OFF[1] + b.y, 6, 0, 7); ctx.stroke();
  readout();
}

function target() {
  const pet = $("pet").value, slot = $("slot").value, mode = $("mode").value, it = chosen()[slot];
  if (mode === "slot") return { obj: A[pet][slot], kind: "slot" };
  if (!it) return null;
  const key = mode === "item" ? it : `${pet}:${it}`;
  A.overrides[key] = A.overrides[key] || {};
  return { obj: A.overrides[key], kind: "override", key };
}

function readout() {
  const pet = $("pet").value, slot = $("slot").value, it = chosen()[slot], b = A[pet][slot];
  let t = `slot ${pet}.${slot}: x ${b.x}  y ${b.y}  scale ${b.scale}  align ${b.align}\n`;
  if (it) {
    const ov = [it, `${pet}:${it}`].map(k => A.overrides[k] ? `${k} ${JSON.stringify(A.overrides[k])}` : "").filter(Boolean);
    const img = imgs[itemSrc(it)];
    t += `item ${it}: ${ov.length ? ov.join("  ") : "no overrides"}\n`;
    img && img.then(i => { const p = placement(pet, it, i);
      $("readout").textContent = t + `final scale ${p.s.toFixed(3)} · ${p.w}×${p.h} · art px ${(ART[it] * p.s).toFixed(1)} (pet ≈ 11.5)`; });
  }
  $("readout").textContent = t;
  $("out").value = serialize();
}

function clean() {  // drop empty / identity overrides
  for (const [k, o] of Object.entries(A.overrides)) {
    for (const f of ["dx", "dy"]) if (o[f] === 0) delete o[f];
    if (o.scale !== undefined && Math.abs(o.scale - 1) < 1e-9) delete o.scale;
    if (!Object.keys(o).length) delete A.overrides[k];
  }
}
function serialize() {
  clean();
  const r = n => Math.round(n * 1000) / 1000;
  const lines = ["{"];
  for (const p of Object.keys(A).filter(k => k !== "overrides")) {
    lines.push(`  "${p}": {`);
    SLOTS.forEach((s, i) => { const b = A[p][s];
      lines.push(`    "${s}": { "x": ${b.x}, "y": ${b.y}, "scale": ${r(b.scale)}, "align": "${b.align}" }${i < SLOTS.length - 1 ? "," : ""}`); });
    lines.push("  },");
  }
  const ov = Object.entries(A.overrides);
  lines.push(`  "overrides": {` + (ov.length ? "" : "}"));
  ov.forEach(([k, o], i) => { const parts = Object.entries(o).map(([f, v]) => `"${f}": ${typeof v === "number" ? r(v) : JSON.stringify(v)}`);
    lines.push(`    "${k}": { ${parts.join(", ")} }${i < ov.length - 1 ? "," : ""}`); });
  if (ov.length) lines.push("  }");
  lines.push("}", "");
  return lines.join("\n");
}

function nudge(dx, dy, ds) {
  const t = target(); if (!t) return;
  const o = t.obj;
  if (t.kind === "slot") { o.x += dx; o.y += dy; o.scale = Math.max(0.05, Math.round((o.scale + ds) * 1000) / 1000); }
  else { o.dx = (o.dx || 0) + dx; o.dy = (o.dy || 0) + dy; if (ds) o.scale = Math.max(0.05, Math.round(((o.scale || 1) + ds) * 1000) / 1000); }
  draw();
}
function resetTarget() {
  const pet = $("pet").value, slot = $("slot").value, t = target(); if (!t) return;
  if (t.kind === "slot") A[pet][slot] = JSON.parse(JSON.stringify(original[pet][slot]));
  else delete A.overrides[t.key];
  draw();
}

document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT" || e.target.tagName === "TEXTAREA") return;
  const step = e.shiftKey ? 10 : 1, sstep = e.shiftKey ? 0.05 : 0.01;
  const map = { ArrowLeft: [-step, 0, 0], ArrowRight: [step, 0, 0], ArrowUp: [0, -step, 0], ArrowDown: [0, step, 0],
    "[": [0, 0, -sstep], "]": [0, 0, sstep], "{": [0, 0, -sstep], "}": [0, 0, sstep] };
  if (map[e.key]) { e.preventDefault(); nudge(...map[e.key]); }
  else if (e.key === "0") resetTarget();
});
let drag = null;
cv.addEventListener("pointerdown", e => { cv.setPointerCapture(e.pointerId); cv.focus(); drag = { x: e.clientX, y: e.clientY }; });
cv.addEventListener("pointermove", e => {
  if (!drag) return;
  const k = 1024 / cv.getBoundingClientRect().width;
  const dx = Math.round((e.clientX - drag.x) * k), dy = Math.round((e.clientY - drag.y) * k);
  if (dx || dy) { drag.x += dx / k; drag.y += dy / k; nudge(dx, dy, 0); }
});
cv.addEventListener("pointerup", () => { drag = null; });

$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(serialize()); $("status").textContent = " copied"; }
  catch { $("out").select(); $("status").textContent = " select + copy from the box"; }
};
$("download").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([serialize()], { type: "application/json" })); a.download = "anchors.json"; a.click();
};
$("reload").onclick = async () => { await loadFile(); draw(); };

(async function init() {
  try { await loadFile(); }
  catch { document.querySelector("aside").insertAdjacentHTML("afterbegin",
    '<p class="err">Could not load ../data/anchors.json. Serve the repo root: python3 -m http.server 8000</p>'); return; }
  $("pet").innerHTML = Object.keys(A).filter(k => k !== "overrides").map(p => `<option>${p}</option>`).join("");
  $("bg").innerHTML = [["#76809a", "flat mid"], ["#14161c", "flat dark"], ["#f2efe6", "flat light"]]
    .map(([v, n]) => `<option value="${v}">${n}</option>`).join("") + BGS.map(b => `<option>${b}</option>`).join("");
  $("slots").innerHTML = SLOTS.map(s => `<label>${s} <select id="sel-${s}"><option value="">none</option>${
    ITEMS[s].map(i => `<option>${i}</option>`).join("")}</select></label>`).join("");
  $("sel-head").value = "cap";
  $("slot").innerHTML = SLOTS.map(s => `<option>${s}</option>`).join("");
  for (const id of ["pet", "bg", "slot", "mode", ...SLOTS.map(s => "sel-" + s)]) $(id).addEventListener("change", () => {
    if (id.startsWith("sel-") && $(id).value) $("slot").value = id.slice(4);
    draw();
  });
  draw();
})();
</script>
</body>
</html>
