[package]
name = "neargotchi-drop1"
version = "0.1.0"
edition = "2021"
description = "NEARGOTCHI drop 1 NFT: 300 tokens, 2 NEAR random hatch with commit → reveal (docs/PLAN-CONTRACT-NFT.md)"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"
near-contract-standards = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# near-sandbox ships binaries for linux x86_64 / aarch64 and macOS arm64 only: on those the sandbox installs itself;
# on Intel macOS near-workspaces builds without it and tests/sandbox.rs is ignored (it runs in CI, .github/workflows).
[target.'cfg(not(all(target_os = "macos", target_arch = "x86_64")))'.dev-dependencies]
near-workspaces = "0.24"

[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dev-dependencies]
near-workspaces = { version = "0.24", default-features = false, features = ["rustls"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
